version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: synapse-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ideamanagement
      POSTGRES_USER: idea_app
      POSTGRES_PASSWORD: idea_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea_app -d ideamanagement"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ideamanagement
      DB_USERNAME: idea_app
      DB_PASSWORD: idea_secure_password
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_BACKEND_URL: http://localhost:8080
        VITE_SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@example.com}
    container_name: synapse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:

